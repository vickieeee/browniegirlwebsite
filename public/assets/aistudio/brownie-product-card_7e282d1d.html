<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrownieGirlCakes Product Card</title>
  <link rel="stylesheet" href="brownie-product-card.css" />
</head>
<body>
  <main class="demo-page">
    <article class="brownie-card">
      <div class="brownie-card__media">
        <!-- Replace this src with your real product image path -->
        <img
          class="brownie-card__image"
          src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85"
          alt="Classic fudgy chocolate brownie"
        />
        <span class="brownie-card__badge">Bestseller</span>
        <button class="brownie-card__wishlist" type="button" aria-label="Add to wishlist">♡</button>
      </div>

      <div class="brownie-card__body">
        <p class="brownie-card__eyebrow">CLASSIC COLLECTION</p>
        <h2 class="brownie-card__name">Classic Fudgy Brownie</h2>
        <p class="brownie-card__description">
          Rich, soft and irresistibly fudgy chocolate goodness.
        </p>

        <div class="brownie-card__meta">
          <span>Premium chocolate</span>
          <span class="brownie-card__dot" aria-hidden="true"></span>
          <span>1 piece</span>
        </div>

        <div class="brownie-card__footer">
          <div class="brownie-card__price-wrap">
            <span class="brownie-card__price-label">Starting from</span>
            <span class="brownie-card__price">₹120</span>
          </div>
          <button class="brownie-card__add" type="button">
            <span>Add to cart</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
